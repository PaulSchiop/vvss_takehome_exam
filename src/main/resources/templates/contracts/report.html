<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Team Payroll Report</title>
</head>
<body>
    <h1>Team Payroll Report</h1>
    <form th:action="@{/contracts/report}" method="get">
        <label>Select Team:</label>
        <select name="teamId" onchange="this.form.submit()">
            <option value="">-- Select a Team --</option>
            <option th:each="t : ${teams}" th:value="${t.id}" th:text="${t.name}" th:selected="${report != null and report.teamName == t.name}"></option>
        </select>
        <button type="submit">View Report</button>
    </form>

    <div th:if="${report != null}">
        <h2 th:text="'Report for ' + ${report.teamName}">Report</h2>
        <table border="1">
            <tr>
                <th>Player Name</th>
                <th>Position</th>
                <th>Salary</th>
            </tr>
            <tr th:each="c : ${report.contracts}">
                <td th:text="${c.playerDTO.name}"></td>
                <td th:text="${c.playerDTO.position}"></td>
                <td th:text="${c.salary}"></td>
            </tr>
        </table>
        <h3>Total Payroll: <span th:text="${report.totalPayroll}"></span></h3>
    </div>
    
    <br/>
    <a th:href="@{/players}">View Players</a> | <a th:href="@{/teams}">View Teams</a> | <a th:href="@{/contracts/sign}">Sign Free Agent</a>
</body>
</html>
